<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Dark Retro Console Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Pixel Grid Backdrop -->
  <g opacity="0.1" stroke="#22c55e" stroke-width="0.5">
    <line x1="16" y1="8" x2="16" y2="56"/>
    <line x1="24" y1="8" x2="24" y2="56"/>
    <line x1="32" y1="8" x2="32" y2="56"/>
    <line x1="40" y1="8" x2="40" y2="56"/>
    <line x1="48" y1="8" x2="48" y2="56"/>
    <line x1="8" y1="16" x2="56" y2="16"/>
    <line x1="8" y1="24" x2="56" y2="24"/>
    <line x1="8" y1="32" x2="56" y2="32"/>
    <line x1="8" y1="40" x2="56" y2="40"/>
    <line x1="8" y1="48" x2="56" y2="48"/>
  </g>

  <!-- Green Pixel Snake Body (8-bit block segments) -->
  <rect x="16" y="32" width="8" height="8" rx="1" fill="#15803d"/>
  <rect x="16" y="24" width="8" height="8" rx="1" fill="#16a34a"/>
  <rect x="24" y="24" width="8" height="8" rx="1" fill="#22c55e"/>
  <rect x="32" y="24" width="8" height="8" rx="1" fill="#4ade80"/>
  <rect x="40" y="24" width="8" height="8" rx="1" fill="#86efac"/>
  
  <!-- Snake Head with pixel eye -->
  <rect x="40" y="24" width="8" height="8" rx="1.5" fill="#4ade80"/>
  <rect x="44" y="26" width="2" height="2" fill="#0f172a"/>

  <!-- Glowing Red Pixel Apple -->
  <rect x="48" y="40" width="8" height="8" rx="2" fill="#ef4444"/>
  <rect x="51" y="38" width="2" height="2" fill="#22c55e"/>
</svg>
